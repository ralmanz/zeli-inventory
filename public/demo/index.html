function val(c){ return Math.round(diff(c)*c.cost*100)/100; }

function recountRequired(c){
  if(c.status==='cerrada') return false;
  if(S.rules.noDoc && c.kind==='none') return true;
  if(S.rules.shortage && c.cause==='Faltante real') return true;
  if(S.rules.judgment && c.kind==='criterio' && Math.abs(val(c))>S.threshold) return true;
  if(c.pair){ var p=byId(c.pair); if(p && S.rules.judgment && p.kind==='criterio' && Math.abs(val(p))>S.threshold) return true; }
  return false;
}
function recountOutcome(c){
  if(c.recount==null || c.recount==='') return null;
  var r=Number(c.recount);
  if(r===c.sys) return 'sistema';
  if(r===c.phys) return 'conteo';
  return 'otro';
}
function readyOne(c){ return !recountRequired(c) || recountOutcome(c)==='conteo' || recountOutcome(c)==='otro'; }
function canPropose(c){ if(!readyOne(c)) return false; if(c.pair){ var p=byId(c.pair); if(p && p.status!=='cerrada' && !readyOne(p)) return false; } return true; }
function baseKind(c){
  if(c.status==='cerrada') return {t:'Error de conteo', c:'t-g'};
  if(c.kind==='doc') return {t:'Documento', c:'t-g'};
  if(c.kind==='criterio') return {t:'Criterio', c:'t-b'};
  return {t:'Sin documento', c:'t-r'};
}
function statusTag(c){
  if(c.approval==='devuelta') return {t:'Devuelta', c:'t-r'};
  if(c.status==='cerrada') return {t:'Cerrada sin ajuste', c:'t-g'};
  if(c.status==='propuesta') return {t: c.approval==='aceptada'?'Aceptada':'Propuesta', c:'t-g'};
  if(recountRequired(c) && !recountOutcome(c)) return {t:'En recuento', c:'t-y'};
  return {t:'Por revisar', c:'t-b'};
}
function sortedCases(){ return S.cases.slice().sort(function(a,b){ return Math.abs(val(b))-Math.abs(val(a)); }); }
function finalQty(c){ var o=recountOutcome(c); if(o==='otro') return Number(c.recount)-c.sys; return diff(c); }
function finalVal(c){ return Math.round(finalQty(c)*c.cost*100)/100; }
function needsAttention(c){ return c.status==='propuesta' && (c.kind!=='doc' || c.cause!==c.originalCause || c.cause==='Faltante real' || recountOutcome(c)==='otro'); }
function inAdjustment(c){ return c.status==='propuesta' && c.approval!=='devuelta' && finalQty(c)!==0; }
function stats(){
  var s={n:S.cases.length, short:0, over:0, doc:0, crit:0, rec:0, none:0, prop:0, closed:0};
  S.cases.forEach(function(c){ var v=val(c); if(v<0) s.short+=v; else s.over+=v;
    if(c.status==='cerrada') { s.closed++; s.doc++; return; }
    if(c.status==='propuesta') s.prop++;
    if(recountRequired(c) && !recountOutcome(c)) { s.rec++; return; }
    if(c.kind==='doc') s.doc++; else if(c.kind==='criterio') s.crit++; else s.none++;
  });
  s.net=s.short+s.over; return s;
}
function adjTotal(){ var t=0; S.cases.forEach(function(c){ if(inAdjustment(c) && (S.signed || c.approval!=='devuelta')) t+=finalVal(c); }); return Math.round(t*100)/100; }

      recountOutcome(c)==='otro' ? ['Recuento distinto','t-r','El recuento dio otro número ('+c.recount+'); el ajuste usa el recuento.'] : ['Requiere criterio','t-b',c.explain];
    var ap = c.approval==='aceptada' ? '<span class="tag t-g">Aceptada</span>' : c.approval==='devuelta' ? '<span class="tag t-r">Devuelta</span>' : '';
    h+='<article class="card pad stack g10"><div class="row between start g10"><div class="row g8"><span class="tag '+why[1]+'">'+why[0]+'</span>'+ap+'</div><span class="mono num '+cls(finalVal(c))+'" style="font-weight:600">'+money(finalVal(c))+'</span></div>'+
      '<h3 class="h3" style="font-size:1.35rem">'+esc(c.name)+' · '+fmtN(finalQty(c))+'</h3><p class="small" style="margin:0">'+esc(why[2])+'</p>'+
      (c.note?'<p class="xs muted" style="margin:0">Nota de quien investiga: '+esc(c.note)+'</p>':'')+
      (S.role==='aprobador' && !S.signed && !c.approval ? '<div class="field"><label for="rn-'+esc(c.id)+'">Comentario (si la devuelve)</label><input id="rn-'+esc(c.id)+'" class="input sm" placeholder="Ej.: confirmar con el cliente antes de ajustar"></div>' : '')+
      (S.role==='aprobador' && !S.signed && !c.approval ? '<div class="row g10" style="margin-top:4px"><button class="btn sm" data-a="accept" data-id="'+esc(c.id)+'">Aceptar</button><button class="btn ghost sm" data-a="return" data-id="'+esc(c.id)+'">Devolver con comentario</button><a class="small" href="#/caso/'+esc(c.id)+'" style="font-weight:650;padding:8px 4px">Ver evidencia</a></div>' :
        '<a class="small" href="#/caso/'+esc(c.id)+'" style="font-weight:650">Ver evidencia</a>')+'</article>'; });
  h+='<section class="card flat pad-s row between g10"><div><h2 class="h3">Respaldadas por documento — '+docOk.length+' casos</h2><p class="small muted" style="margin:4px 0 0">Facturas, guías, recepciones y notas de crédito que explican cada una.'+(closed.length?' '+closed.length+' se cerró por error de conteo.':'')+'</p></div><a href="#/diferencias" class="small" style="font-weight:700">Ver lista →</a></section>';
  if(out.length) h+='<section class="card dash pad-s stack g6"><h2 class="h3">Fuera de este ajuste — '+out.length+'</h2><p class="small muted" style="margin:0">'+out.map(function(c){return esc(c.name);}).join(', ')+'. Siguen sin propuesta o en recuento; pasan abiertos al próximo conteo.</p></section>';
  h+='</div><aside class="side"><section class="card flat pad stack g8" aria-labelledby="ec"><h2 id="ec" class="h3">Efecto contable sugerido</h2><ul class="list small">';
  Object.keys(cats).forEach(function(k){ h+='<li class="row between g10"><span>'+esc(k)+'</span><span class="mono num '+cls(cats[k])+'" style="font-weight:600">'+money(cats[k])+'</span></li>'; });
  h+='</ul><span class="xs muted">Es una sugerencia por categoría. Las cuentas y el asiento los define su contador.</span></section>';
  if(S.signed){
    h+='<section class="card dark pad stack g10"><h2 class="h2">Firmado</h2><p class="small" style="margin:0">'+esc(S.signed.by)+' · '+esc(S.signed.at)+'</p><a class="btn yellow block" href="#/ajuste">Ver archivo de ajuste</a></section>';
  } else if(S.role==='aprobador'){
    var ready=pendingAtt===0;
    h+='<section class="card dark pad stack g12" aria-labelledby="fi"><h2 id="fi" class="h2">Firmar</h2><p class="small" style="margin:0">'+(out.length?out.length+' caso(s) quedan fuera del ajuste y pasan al próximo conteo. ':'')+(ready?'Todos los casos de atención están decididos.':'Decida los '+pendingAtt+' casos de atención para firmar.')+'</p>'+
      '<label class="check"><input type="checkbox" id="ack"'+(ready?'':' disabled')+'> Revisé los casos que requieren mi atención y apruebo el ajuste</label>'+
      '<button class="btn yellow block" data-a="sign"'+(ready?'':' disabled')+'>Firmar cierre</button>'+
      '<button class="btn ghost-light block" data-a="returnall">Devolver todo a quien investiga</button></section>';
  } else {
    var apName=self?S.investigator+' (usted mismo)':S.approver.split(' · ')[0];
    h+= S.sentForApproval
      ? '<section class="card dark pad stack g10"><span class="mono xs" style="color:var(--yellow)">Siguiente paso del ejemplo</span><h2 class="h2">Enviado a '+esc(apName)+'</h2><p class="small" style="margin:0">'+(self?'Usted mismo revisa y firma.':'Le llegó un enlace que abre directo aquí. Véalo desde su lado: acepta o devuelve los casos y firma.')+'</p>'+
        '<button class="btn yellow block" data-a="role" data-v="aprobador">'+(self?'Revisar y firmar yo mismo':'Así le llega a quien aprueba →')+'</button></section>'
      : '<section class="card dark pad stack g10"><h2 class="h2">Firma</h2><p class="small" style="margin:0">Firma '+esc(apName)+'. Primero envíe el cierre desde Diferencias.</p><a class="btn yellow block" href="#/diferencias">Ir a Diferencias</a></section>';
  }
  return h+'</aside></div></main>';
}

/* ---------- pantalla 6 ---------- */
function adjLines(){ return sortedCases().filter(function(c){ return inAdjustment(c) && c.approval!=='devuelta'; }); }
function vAjuste(){
  var h=header('ajuste')+'<main class="wrap page">';
  if(!S.signed){
    return h+'<div><h1 class="display">Archivo de ajuste</h1><p class="lede">Se habilita cuando quien aprueba firma el cierre.</p></div><div class="card pad stack g12" style="max-width:640px"><p style="margin:0">Mientras tanto, el ajuste neto propuesto es <strong class="mono">'+money(adjTotal())+'</strong>.</p><a class="btn" href="#/aprobacion" style="align-self:flex-start">Ir a aprobación</a></div></main>';
  }
  var lines=adjLines(); var out=S.cases.filter(function(c){return c.status!=='propuesta'&&c.status!=='cerrada';});
  var accepted=S.cases.filter(function(c){return c.status==='propuesta' && c.cause===c.originalCause && c.approval!=='devuelta';}).length;
  var proposed=S.cases.filter(function(c){return c.status==='propuesta';}).length;
  h+='<div class="row between end g16"><div><h1 class="display">Archivo de ajuste</h1><p class="lede">Firmado por '+esc(S.signed.by)+' · '+esc(S.signed.at)+' · investigó '+esc(S.investigator)+'</p></div><span class="stamp">FIRMADO</span></div>'+
    (selfApproval()?'<p class="note" style="margin:0">Investigó y aprobó la misma persona. El informe lo indica como “sin separación de funciones”.</p>':'')+
    '<div class="main-side"><div class="main"><section class="card" style="overflow:hidden" aria-labelledby="la"><div class="pad-s"><h2 id="la" class="h2">Líneas aprobadas <span class="sub">— '+lines.length+'</span></h2></div><div class="tablebox"><table style="min-width:860px"><thead><tr><th>Artículo</th><th class="r">Ajuste</th><th class="r">Valor</th><th>Causa · respaldo</th><th>Categoría sugerida</th></tr></thead><tbody>';
  lines.forEach(function(c){ var q=finalQty(c), v=finalVal(c);
    h+='<tr><td><strong>'+esc(c.name)+'</strong><div class="mono code">'+esc(c.id)+'</div></td><td class="r mono num '+cls(q)+'" style="font-weight:600">'+fmtN(q)+'</td><td class="r mono num '+cls(v)+'" style="font-weight:600">'+money(v)+'</td><td><div style="font-weight:650">'+esc(c.cause)+'</div><div class="xs muted">'+esc(c.summary)+(c.cause!==c.originalCause?' · causa cambiada por quien investiga':'')+'</div></td><td class="small">'+esc(CATEGORY[c.cause])+'</td></tr>'; });
  h+='</tbody></table></div></section>'+
    (out.length?'<section class="card dash pad-s stack g6"><h2 class="h3">Fuera de este ajuste — '+out.length+'</h2><p class="small muted" style="margin:0">'+out.map(function(c){return esc(c.name);}).join(', ')+'. Pasan abiertos al próximo conteo.</p></section>':'')+
    '</div><aside class="side"><section class="card pad stack g12" aria-labelledby="dl"><h2 id="dl" class="h2">Descargar</h2><div class="stack g4" style="padding-bottom:12px;border-bottom:1px solid var(--rule)"><span class="xs muted" style="font-weight:650">Ajuste neto firmado</span><span class="mono num" style="font-size:1.8rem;font-weight:600">'+money(adjTotal())+'</span></div>'+
      '<button class="btn block" data-a="csv">Archivo de ajuste (CSV para Excel)</button><button class="btn ghost block" data-a="csvimp">CSV para importar al ERP</button><button class="btn ghost block" data-a="report">Informe de cierre (imprimir o PDF)</button>'+
      '<p class="xs muted" style="margin:0">El informe lista cada diferencia con su causa, sus documentos, quién la propuso y quién la firmó'+(S.account==='firma'?', con el nombre de '+esc(S.firm):'')+'.</p><p class="note xs" style="margin:0">Este archivo no modifica su sistema. Impórtelo o regístrelo en su ERP como cualquier ajuste.</p></section>'+
    (S.account==='firma'?'<section class="card dark pad stack g8"><span class="mono xs" style="color:var(--yellow)">Para usted, consultor</span><h2 class="h3" style="font-size:1.4rem">'+accepted+' de '+proposed+' causas sugeridas aceptadas sin cambios</h2><p class="small" style="margin:0">Con más cierres, cada causa muestra qué tan seguido acierta.</p></section>':'')+
    '</aside></div></main>';
  return h;
}

/* ---------- informe imprimible ---------- */
function buildReport(listOnly){
  var r=document.getElementById('report');
  if(listOnly){
    var req=sortedCases().filter(function(c){ return recountRequired(c) && !recountOutcome(c); });
    r.innerHTML='<h1 style="font-size:20pt;margin:0 0 4px">Lista de recuento</h1><p>'+esc(S.company)+' · '+esc(S.closeName)+' · corte '+esc(S.cutoff)+'</p><table><thead><tr><th>Ubicación</th><th>Código</th><th>Artículo</th>'+(S.rules.blind?'':'<th>Sistema</th>')+'<th>Recuento</th></tr></thead><tbody>'+
      req.map(function(c){return '<tr><td>'+esc(c.loc)+'</td><td>'+esc(c.id)+'</td><td>'+esc(c.name)+'</td>'+(S.rules.blind?'':'<td>'+c.sys+'</td>')+'<td style="width:30mm">&nbsp;</td></tr>';}).join('')+'</tbody></table>';
    return;
  }
  var lines=adjLines();
  r.innerHTML='<h1 style="font-size:20pt;margin:0 0 4px">Informe de cierre de conteo</h1>'+
    '<p style="margin:0 0 2px">'+esc(S.company)+' · '+esc(S.closeName)+' · corte '+esc(S.cutoff)+'</p>'+
    '<p style="margin:0 0 2px">Investigó: '+esc(S.investigator)+(S.account==='firma'?' ('+esc(S.firm)+')':'')+' · Firmó: '+esc(S.signed?S.signed.by:'—')+' · '+esc(S.signed?S.signed.at:'')+'</p>'+
    (selfApproval()?'<p style="margin:0 0 2px"><strong>Sin separación de funciones:</strong> investigó y aprobó la misma persona.</p>':'')+
    '<p style="margin:8px 0">Ajuste neto: <strong>'+money(adjTotal())+'</strong></p>'+
    '<table><thead><tr><th>Código</th><th>Artículo</th><th>Ajuste</th><th>Valor</th><th>Causa</th><th>Respaldo</th><th>Categoría</th></tr></thead><tbody>'+
    lines.map(function(c){return '<tr><td>'+esc(c.id)+'</td><td>'+esc(c.name)+'</td><td>'+fmtN(finalQty(c))+'</td><td>'+money(finalVal(c))+'</td><td>'+esc(c.cause)+'</td><td>'+esc(c.summary)+'</td><td>'+esc(CATEGORY[c.cause])+'</td></tr>';}).join('')+'</tbody></table>'+
    '<h2 style="font-size:13pt;margin:14px 0 4px">Registro</h2><ul style="font-size:9.5pt">'+S.log.map(function(l){return '<li>'+esc(l.at)+' · '+esc(l.by)+' · '+esc(l.t)+'</li>';}).join('')+'</ul>';
}
function csv(rows){ return rows.map(function(r){ return r.map(function(x){ x=String(x==null?'':x); return /[",\n;]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }).join(','); }).join('\r\n'); }
function download(name, text){ try{ var b=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}); var u=URL.createObjectURL(b); var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(u); a.remove();},500); toast('Descargado: '+name); }catch(e){ toast('No se pudo descargar en este navegador'); } }

/* ---------- router ---------- */
function route(){
  var h=location.hash.replace(/^#\/?/,'');
  if(h==='inicio'||h==='pasos'||h==='datos'||h==='piloto') h='';
  var p=h.split('/'); var v;
  switch(p[0]){
    case 'archivos': v=vArchivos(); break;
    case 'diferencias': v=vDiferencias(); break;
    case 'caso': v=vCaso(decodeURIComponent(p[1]||'')); break;
    case 'recuento': v=vRecuento(); break;
    case 'aprobacion': v=vAprobacion(); break;
    case 'ajuste': v=vAjuste(); break;
    default: v=vHome();
  }
  document.getElementById('root').innerHTML=v;
  var titles={archivos:'Archivos',diferencias:'Diferencias',caso:'Revisión',recuento:'Recuento',aprobacion:'Aprobación',ajuste:'Ajuste'};
  document.title='Zeli Inventory — '+(titles[p[0]]||(S.account==='firma'?'Clientes':'Mis cierres'));
}
function go(hash){ if(location.hash===hash) route(); else location.hash=hash; }
window.addEventListener('hashchange', function(){ route(); window.scrollTo(0,0); });

/* ---------- acciones ---------- */
document.addEventListener('click', function(e){
  var t=e.target.closest('[data-a]'); if(!t || t.disabled) return;
  var a=t.getAttribute('data-a'), id=t.getAttribute('data-id'), v=t.getAttribute('data-v'), c=id?byId(id):null;
  switch(a){
    case 'role': S.role=v; save(); go(v==='aprobador'?'#/aprobacion':'#/diferencias'); toast(v==='aprobador'?'Ahora ve lo que recibe quien aprueba':'De vuelta como quien investiga'); break;
    case 'reset': try{localStorage.removeItem(KEY);}catch(x){} S=seed(); FILTER='todas'; go('#/'); toast('Ejemplo reiniciado'); break;
    case 'filter': FILTER=v; route(); break;
    case 'soon': toast('Disponible en la siguiente versión'); break;
    case 'propose':
      if(!canPropose(c)) return;
      var wasProp=c.status==='propuesta';
      c.status='propuesta'; c.proposedBy=who(); c.approval=null;
      if(c.pair){ var pr=byId(c.pair); if(pr && pr.status!=='propuesta'){ pr.status='propuesta'; pr.proposedBy=who(); pr.cause=c.cause==='Cruce de referencias'?'Cruce de referencias':pr.cause; pr.approval=null; } }
      logIt((wasProp?'Actualizó':'Propuso')+' '+c.id+': '+c.cause); save(); toast('Propuesta registrada'); go('#/caso/'+firstOpenCase()); break;
    case 'accept': c.approval='aceptada'; if(c.pair){var p2=byId(c.pair); if(p2) p2.approval='aceptada';} logIt('Aceptó '+c.id); save(); route(); break;
    case 'return':
      var inp=document.getElementById('rn-'+c.id); var msg=inp?inp.value.trim():'';
      c.approval='devuelta'; c.returnNote=msg; if(c.pair){var p3=byId(c.pair); if(p3){p3.approval='devuelta'; p3.returnNote=msg;}} logIt('Devolvió '+c.id+(msg?': '+msg:'')); save(); route(); break;
    case 'returnall': S.sentForApproval=false; logIt('Devolvió el cierre completo'); S.role='investigador'; save(); toast('Cierre devuelto a quien investiga'); go('#/diferencias'); break;
    case 'sign':
      var ack=document.getElementById('ack'); if(!ack || !ack.checked){ toast('Marque la casilla de revisión para firmar'); ack&&ack.focus(); return; }
      S.signed={by:S.approver.split(' · ')[0] + (selfApproval()?' (misma persona que investiga)':''), at:now()}; logIt('Firmó el cierre'); save(); go('#/ajuste'); toast('Cierre firmado'); break;
    case 'send': S.sentForApproval=true; logIt('Envió el cierre a aprobación'); save(); toast(selfApproval()?'Listo para que usted mismo lo firme':'Enlace enviado a '+S.approver.split(' · ')[0]); go('#/aprobacion'); break;
    case 'csv':
      download('ajuste_'+S.company.replace(/\W+/g,'_')+'.csv', csv([['Código','Artículo','Ubicación','Sistema','Físico','Ajuste','Costo','Valor','Causa','Respaldo','Categoría sugerida','Propuso','Firmó']].concat(adjLines().map(function(c){return [c.id,c.name,c.loc,c.sys,c.phys,finalQty(c),c.cost.toFixed(2),finalVal(c).toFixed(2),c.cause,c.summary,CATEGORY[c.cause],c.proposedBy==='auto'?S.investigator:c.proposedBy,S.signed?S.signed.by:''];})))); break;
    case 'csvimp':
      download('ajuste_importar.csv', csv([['codigo','cantidad','costo_unitario','motivo']].concat(adjLines().map(function(c){return [c.id,finalQty(c),c.cost.toFixed(2),c.cause];})))); break;
    case 'report': buildReport(false); window.print(); break;
    case 'printlist': buildReport(true); window.print(); break;
  }
});
document.addEventListener('change', function(e){
  var t=e.target;
  if(t.hasAttribute('data-rule')){ S.rules[t.getAttribute('data-rule')]=t.checked; save(); return; }
  if(t.getAttribute('data-a')==='cause'){ var c=byId(t.getAttribute('data-id')); c.cause=t.value; if(c.cause==='Faltante real' && c.kind==='doc'){} logIt('Cambió la causa de '+c.id+' a '+c.cause); save(); route(); return; }
  if(t.getAttribute('data-a')==='recount'){ var r=byId(t.getAttribute('data-id')); var raw=t.value.replace(/[^\d]/g,''); r.recount= raw===''?null:Number(raw);
    var o=recountOutcome(r);
    if(o==='sistema'){ r.status='cerrada'; logIt('Recuento de '+r.id+': '+raw+' (igual al sistema, error de conteo)'); }
    else { if(r.status==='cerrada') r.status = r.kind==='doc'?'propuesta':'revisar'; if(o) logIt('Recuento de '+r.id+': '+raw); }
    save(); route(); var nx=document.getElementById('rc-'+r.id); return; }
  if(t.getAttribute('data-a')==='file'){ toast('En esta versión se usa el archivo de ejemplo'); t.value=''; return; }
});
document.addEventListener('input', function(e){
  var t=e.target; var f=t.getAttribute('data-f');
  if(f){ if(f==='threshold'){ var n=Number(t.value.replace(/[^\d.]/g,'')); if(!isNaN(n)&&n>0) S.threshold=n; } else S[f]=t.value; save(); return; }
  if(t.getAttribute('data-a')==='note'){ var c=byId(t.getAttribute('data-id')); c.note=t.value; save(); }
});

route();
})();
</script>
</body>
</html>
